  <rect x="108" y="150" width="22" height="40" rx="11" fill="#F2B04A"/>
  <ellipse cx="121" cy="189" rx="15" ry="7" fill="#E0952F"/>
  <!-- chest patch -->
  <path d="M104 118 C116 122 124 136 122 152 L104 152 C98 140 98 128 104 118 Z" fill="#FBE3B8"/>
  <!-- head -->
  <ellipse cx="124" cy="72" rx="31" ry="28" fill="#F2B04A"/>

  <!-- ear -->
  <path d="M100 54 C84 52 78 76 88 96 C102 94 108 76 108 62 Z" fill="#C97A1E"/>
  <!-- eye + nose -->
  <circle cx="132" cy="68" r="4.5" fill="#2B2B2B"/>

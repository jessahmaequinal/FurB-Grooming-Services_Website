  <!-- mouth -->
  <path d="M148 94 C154 98 162 97 166 92" fill="none" stroke="#2B2B2B" stroke-width="2.5" stroke-linecap="round"/>
  <!-- collar -->
  <path d="M100 100 C112 110 126 108 134 98" fill="none" stroke="#E62A34" stroke-width="7" stroke-linecap="round"/>
